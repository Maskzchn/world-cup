<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">CC Browser Bridge</div>
      <div id="status" class="status disconnected">● 未连接</div>
    </header>

    <section class="card">
      <div class="row">
        <label for="port">桥接端口</label>
        <input id="port" type="number" min="1" max="65535" />
        <button id="savePort" class="ghost">保存</button>
      </div>
      <button id="reconnect" class="ghost wide">重新连接</button>
    </section>

    <section class="card">
      <div class="tab-title" id="tabTitle">当前标签页</div>
      <div class="tab-url" id="tabUrl"></div>
      <button id="toggleTab" class="primary wide">在当前标签页启用</button>
      <div class="hint">只有“已启用”的标签页才允许 Claude Code 操作。</div>
    </section>

    <footer>
      <span id="enabledCount"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
